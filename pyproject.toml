[project]
name = "xarray-fits"
version = "0.2.6"
description = "xarray Datasets for FITS-like data"
authors = [{name = "Simon Perkins", email = "simon.perkins@gmail.com"}]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.0",
    "dask[array]",
    "xarray>=2025.0",
    "fsspec",
    "rarg-python-patterns>=0.0.5",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "dask>=2024.5.0",
    "distributed>=2024.5.0",
    "platformdirs>=4.3.8",
    # Conformance oracle, pinned until a release ships image schema 0.0.2
    "xradio[zarr] @ git+https://github.com/casangi/xradio@70412d6183ed8aebeea49dbcef57bbb9e04917a9 ; python_version < '3.14'",
]
dev = [
    "pre-commit>=3.8.0",
    "tbump>=6.11.0",
]
doc = [
    "sphinx>=8.0.2",
    "pygments>=2.18.0",
    "sphinx-copybutton>=0.5.2",
    "pydata-sphinx-theme>=0.15.4",
]

[project.entry-points."xarray.backends"]
"xarray-fits:fits" = "xarrayfits.backend.fits.entrypoint:FitsEntryPoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xarrayfits"]

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
extend-select = ["I"]

[tool.tbump]
github_url = "https://github.com/ratt-ru/xarray-fits"

[tool.tbump.version]
current = "0.2.6"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "{new_version}"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "docs/source/conf.py"
search = 'release = "{current_version}"'

[[tool.tbump.file]]
src = "xarrayfits/__init__.py"
search = '__version__ = "{current_version}"'
